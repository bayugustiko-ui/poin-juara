<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEBY — DS Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --red:#B01021; --red-deep:#7E0B18; --red-ink:#FFFFFF; --red-soft:#FCE5E8; --red-line:#F0C9CE;
  --bg:#F2EDEA; --surface:#FFFFFF; --surface-2:#FAF5F2; --surface-3:#F0E9E5;
  --ink:#12100F; --ink-dim:#6B6260; --ink-faint:#9A918E;
  --border:#E3DAD5; --border-strong:#D2C6C0;
  --good:#1E8E5A; --good-soft:#DFF3E7;
  --warn:#B5650A; --warn-soft:#F8EBD8;
  --bad:#9F1239; --bad-soft:#FBE3EA;
  --shadow:0 1px 2px rgba(18,16,15,.05), 0 10px 28px -14px rgba(18,16,15,.22);
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance;}
button{font-family:inherit;}
a{color:var(--red);}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}

/* ---------- shell ---------- */
#app{min-height:100vh;}
.wrap-mobile{max-width:480px;margin:0 auto;background:var(--surface-2);min-height:100vh;box-shadow:var(--shadow);padding-bottom:78px;}
.wrap-plain{max-width:480px;margin:0 auto;padding:0 0 40px;}
.topbar{background:var(--red);color:var(--red-ink);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;}
.topbar .brand{display:flex;align-items:baseline;gap:8px;}
.topbar .brand b{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.topbar .brand span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;opacity:.8;text-transform:uppercase;}
.topbar .tb-act{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;}
.topbar .tb-act:hover{background:rgba(255,255,255,.26);}
.hero{background:var(--red);color:var(--red-ink);padding:6px 18px 26px;}
.hero .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.82;}
.hero h1{font-size:25px;margin:6px 0 4px;}
.hero p{margin:0;font-size:13.5px;opacity:.86;}
.pad{padding:18px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:10px;align-items:center;}
.grow{flex:1;min-width:0;}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
.card.flat{box-shadow:none;}
.card.lift{box-shadow:var(--shadow);}
.card-title{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;}
.sec-head h2{font-size:17px;}
.sec-head .link{font-size:12.5px;color:var(--red);cursor:pointer;background:none;border:none;padding:0;font-weight:600;}

/* ---------- stat ---------- */
.stat-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.stat .n{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em;}
.stat .n.red{color:var(--red);}
.stat .k{margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:14.5px;padding:12px 18px;cursor:pointer;transition:filter .15s;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:not(:disabled):hover{filter:brightness(1.06);}
.btn-primary{background:var(--red);color:var(--red-ink);}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--ink);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-danger{background:var(--bad-soft);color:var(--bad);}
.btn-ok{background:var(--good-soft);color:var(--good);}
.btn-block{width:100%;}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px;}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;}
.field + .field{margin-top:13px;}
.field label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:15px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);width:100%;
}
.field input:disabled,.field select:disabled{background:var(--surface-3);color:var(--ink-dim);}
.field textarea{font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.5;resize:vertical;}
.field .hint{font-size:11.5px;color:var(--ink-dim);}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.req::after{content:" *";color:var(--red);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:92px;padding:11px 8px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-dim);font-weight:700;font-size:13.5px;cursor:pointer;}
.seg button.on{background:var(--red);border-color:var(--red);color:var(--red-ink);}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-dim);font-size:12.5px;font-weight:600;cursor:pointer;}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.pill-red{background:var(--red-soft);color:var(--red);}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-warn{background:var(--warn-soft);color:var(--warn);}
.pill-bad{background:var(--bad-soft);color:var(--bad);}
.pill-neutral{background:var(--surface-3);color:var(--ink-dim);}
.grp{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;}
.grp-ds{background:var(--red-soft);color:var(--red);}
.grp-ypcr{background:#E6EAF7;color:#3A4E8C;}
.grp-bud{background:#F6E7D6;color:#8A5418;}

/* ---------- task item ---------- */
.task{border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--surface);}
.task + .task{margin-top:10px;}
.task .t-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.task .t-name{font-weight:700;font-size:15px;}
.task .t-sub{font-size:12.5px;color:var(--ink-dim);margin-bottom:12px;}

/* ---------- leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:var(--red-soft);border-radius:11px;padding:11px 12px;border-bottom:none;}
.lb-rank{width:32px;height:32px;border-radius:9px;background:var(--surface-3);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;flex:none;}
.lb-rank.r1{background:var(--red);color:#fff;}
.lb-rank.r2{background:#C4626F;color:#fff;}
.lb-rank.r3{background:#D79AA3;color:#fff;}
.lb-name{font-weight:700;font-size:14px;}
.lb-sub{font-size:11.5px;color:var(--ink-dim);}
.lb-pts{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;}

/* ---------- photo ---------- */
.photo-tile{border:1.5px dashed var(--border-strong);border-radius:13px;aspect-ratio:3/4;max-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-dim);background:var(--surface-3);overflow:hidden;position:relative;}
.photo-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-tile .retake{position:absolute;bottom:10px;right:10px;background:rgba(18,16,15,.75);color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px;}
.photo-tile .ph-ico{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;}
.photo-tile span.cap{font-size:12.5px;font-weight:600;}
.gate-dark{background:var(--ink);color:#fff;border-radius:16px;padding:20px;}
.gate-dark h2{color:#fff;font-size:21px;margin-bottom:6px;}
.gate-dark p{color:rgba(255,255,255,.72);font-size:13px;margin:0 0 16px;}
.gate-dark .photo-tile{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);}
.gate-meta{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;}
.gate-meta .k{color:rgba(255,255,255,.6);}
.gate-meta .v{font-family:"IBM Plex Mono",monospace;font-weight:600;}

/* ---------- quiz ---------- */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.q-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim);}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .25s;}
.q-text{font-weight:700;font-size:16px;margin:14px 0 12px;}
.opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;background:var(--surface);}
.opt + .opt{margin-top:9px;}
.opt:has(input:checked){border-color:var(--red);background:var(--red-soft);}
.opt input{margin-top:3px;accent-color:var(--red);flex:none;}
.opt .ot{font-size:14.5px;}
.rev{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--border);}
.rev:last-child{border-bottom:none;}
.rev .mk{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;color:#fff;}
.rev .mk.y{background:var(--good);}
.rev .mk.n{background:var(--bad);}
.rev .rt{font-weight:600;font-size:13.5px;}
.rev .rs{font-size:12px;color:var(--ink-dim);}
.rev .rp{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;}
.bnav button{background:none;border:none;padding:10px 4px 12px;cursor:pointer;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;}
.bnav button.on{color:var(--red);}
.bnav .bi{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.06em;}
.bnav .bt{font-size:10.5px;font-weight:600;}

/* ---------- menu grid ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.mgrid button{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
.mgrid .mi{width:32px;height:32px;border-radius:9px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;}
.mgrid .mt{font-size:11px;font-weight:600;color:var(--ink-dim);text-align:center;line-height:1.25;}

/* ---------- knowledge ---------- */
.kn{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;}
.kn + .kn{margin-top:9px;}
.kn .kt{width:38px;height:38px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;flex:none;}
.kn .kn-n{font-weight:700;font-size:14px;}
.kn .kn-s{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
.kn .ka{margin-left:auto;color:var(--ink-faint);font-size:16px;}

/* ---------- reward ---------- */
.rw{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
.rw + .rw{margin-top:10px;}
.rw .rw-n{font-weight:700;font-size:14.5px;}
.rw .rw-s{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
.rw .rw-p{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:var(--red);}

/* ---------- ledger ---------- */
.led{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;}
.led:last-child{border-bottom:none;}
.led .ld{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);width:74px;flex:none;}
.led .lv{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;}
.led .lv.pos{color:var(--good);}
.led .lv.neg{color:var(--bad);}
.led .lb2{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);width:48px;text-align:right;flex:none;}

/* ---------- admin ---------- */
.adm{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.adm-side{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.adm-side .a-brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
.adm-side .a-brand b{font-size:18px;font-weight:800;}
.adm-side .a-brand span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;color:rgba(255,255,255,.55);text-transform:uppercase;}
.adm-side button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:none;color:rgba(255,255,255,.72);text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;}
.adm-side button:hover{background:rgba(255,255,255,.07);color:#fff;}
.adm-side button.on{background:var(--red);color:#fff;}
.adm-side .cnt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:99px;}
.adm-side button.on .cnt{background:rgba(0,0,0,.22);}
.adm-main{padding:26px 30px 60px;max-width:1180px;}
.adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.adm-head h1{font-size:26px;}
.adm-head .sub{font-size:13px;color:var(--ink-dim);margin-top:3px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:13px;background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:11px 13px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);}
td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;background:var(--surface-3);}
.aq{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
.aq + .aq{margin-top:10px;}
.aq .aq-n{font-weight:700;font-size:14px;}
.aq .aq-s{font-size:12.5px;color:var(--ink-dim);}
.prog{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px;}
.prog > i{display:block;height:100%;background:var(--red);}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--ink-dim);font-size:13.5px;}
.note{font-size:12px;color:var(--ink-dim);background:var(--surface-3);border-radius:10px;padding:11px 13px;}
.err{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:80;max-width:88vw;text-align:center;}
.toast.ok{background:var(--good);}
.toast.no{background:var(--bad);}
.modal-bd{position:fixed;inset:0;background:rgba(18,16,15,.62);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cmp img{width:100%;border-radius:10px;border:1px solid var(--border);}
.cmp .cl{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;}
.center-narrow{max-width:400px;margin:0 auto;padding:40px 18px;}
@media (max-width:860px){
  .adm{grid-template-columns:1fr;}
  .adm-side{position:static;height:auto;}
  .adm-side .a-nav{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
  .adm-main{padding:20px 16px 50px;}
}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-dim);}
.skel{color:var(--ink-faint);font-size:13px;padding:14px 0;text-align:center;}
.rank-note{font-size:11.5px;color:var(--ink-dim);margin-top:4px;}
[hidden]{display:none!important;}
button.photo-tile{font:inherit;padding:0;width:100%;}
.cam-overlay{position:fixed;inset:0;max-width:520px;margin:0 auto;background:#0d0b0b;color:#fff;z-index:100;display:flex;flex-direction:column;gap:12px;padding:16px;}
.cam-top{display:flex;align-items:center;justify-content:space-between;}
.cam-top b{font-size:17px;font-weight:800;}
.cam-x{background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 13px;border-radius:9px;font-weight:600;cursor:pointer;}
.cam-frame{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#000;}
.cam-frame video,.cam-frame .cam-still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.cam-guide{position:absolute;left:50%;top:46%;width:62%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.55);border-radius:50%;pointer-events:none;}
.cam-msg{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.85);min-height:40px;}
.cam-msg.bad{color:#ffb4a8;}
.cam-msg.warn{color:#f3c97a;}
.cam-actions{display:flex;flex-direction:column;gap:9px;}
.cam-sec{background:rgba(255,255,255,.12);color:#fff;}
.cam-warn{background:#6b4a12;color:#fde7b8;}
</style>
</head>

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtTgl(iso) {
  if (!iso) return "-";
  try { return new Date(iso).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "2-digit" }); }
  catch (e) { return iso; }
}
function fmtWaktu(iso) {
  if (!iso) return "-";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }) + " " +
      d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return iso; }
}
/* Periode dalam UTC agar sama persis dengan pengecekan kuota di security rules */
function periode(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
}
function hariIni() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function nowIso() { return new Date().toISOString(); }

/* ---------- identitas perangkat ---------- */
async function pastikanAnon() {
  if (auth.authStateReady) await auth.authStateReady();
  const u = auth.currentUser;
  if (u && u.isAnonymous) {
    try { await u.getIdToken(true); return u.uid; }
    catch (e) { await signOut(auth).catch(() => {}); }
  } else if (u) {
    await signOut(auth);
  }
  return (await signInAnonymously(auth)).user.uid;
}

/* Saat aplikasi dibuka: perangkat ini sudah terikat ke akun siapa? */
async function sesiPerangkat() {
  if (auth.authStateReady) await auth.authStateReady();
  const u = auth.currentUser;
  if (!u || !u.isAnonymous) return null;
  try {
    const sa = await getDoc(doc(db, "sesiAuth", u.uid));
    return sa.exists() ? sa.data().userId : null;
  } catch (e) { return null; }
}

async function ikatPerangkat(userId, kode) {
  const authUid = await pastikanAnon();
  const sa = await getDoc(doc(db, "sesiAuth", authUid));
  if (sa.exists()) {
    if (sa.data().userId === userId) return "sudah";
    throw errKode("hp-akun-lain", { akunLain: sa.data().userId });
  }
  return authUid;
}

async function masukPetugas(idInput, usernameInput) {
  const userId = normUserId(idInput);
  const kode = normKode(usernameInput);
  if (!USERID_RE.test(userId)) throw errKode("format-id");
  if (!kode) throw errKode("username-kosong");
  const d = await getDoc(doc(db, "petugas", userId));
  if (!d.exists()) throw errKode("tidak-terdaftar");
  const p = d.data();
  if (p.kode !== kode) throw errKode("username-salah");
  if (p.status === "nonaktif") throw errKode("nonaktif");
  const authUid = await ikatPerangkat(userId, kode);
  if (authUid === "sudah") return userId;
  const b = writeBatch(db);
  b.set(doc(db, "perangkat", userId), { authUid, kode, waktu: nowIso() });
  b.set(doc(db, "sesiAuth", authUid), { userId });
  try { await b.commit(); }
  catch (e) { if (e.code === "permission-denied") throw errKode("terikat-hp-lain"); throw e; }
  return userId;
}

async function daftarBaru(d) {

  if ((await getDoc(doc(db, "petugas", userId))).exists()) throw errKode("sudah-terdaftar");
  const dobel = await getDocs(query(col("petugas"), where("kode", "==", kode), limit(1)));
  if (!dobel.empty) throw errKode("username-dipakai");
  const authUid = await ikatPerangkat(userId, kode);
  if (authUid === "sudah") throw errKode("sudah-terdaftar");
  const pub = {
    nama: d.nama.trim(), group: d.group, kode,
    area: d.area, regional: d.regional, branch: d.branch, cluster: d.cluster,
    status: "review", sumber: "daftar", createdAt: nowIso(), poinPeringkat: 0, saldo: 0
  };
  pub[GRP_FIELD[d.group]] = 0;

  b.set(doc(db, "petugas_cek", userId), { nomor: d.nomor.trim(), foto: d.foto });
  b.set(doc(db, "perangkat", userId), { authUid, kode, waktu: nowIso() });

function sesuaiTarget(item, p) {
  const t = item.target || {};
  if (t.group && t.group !== "semua" && t.group !== p.group) return false;
  if (t.area && t.area !== p.area) return false;
  if (t.regional && t.regional !== p.regional) return false;
  const h = hariIni();
  if (item.mulai && h < item.mulai) return false;
  if (item.selesai && h > item.selesai) return false;
  return true;
}

  return {
    ku: C.katalog.kuesioner.filter((k) => sesuaiTarget(k, p)),
    pt: C.katalog.posttest.filter((t) => sesuaiTarget(t, p))
  };
}

/* Anti-curang tanpa server berbayar: jawaban dikunci dulu → baru kunci jawaban boleh dibaca
   → rules menghitung ulang jumlah benar dari jawaban terkunci × kunci asli. */
async function kunciJawaban(p, t, jawaban) {
  const ref = doc(db, "jawaban", t.id + "_" + p.id);
  const idx = (t.soal || []).map((q) => (jawaban && jawaban[q.id] != null ? jawaban[q.id] : -1));
  try {
    await setDoc(ref, { userId: p.id, testId: t.id, idx, waktu: nowIso() });
    return idx;
  } catch (e) {
    const ada = await getDoc(ref).catch(() => null);
    if (ada && ada.exists()) return ada.data().idx || [];
    throw e;
  }
}
async function jawabanTerkunci(tid, userId) {
  try {
    const d = await getDoc(doc(db, "jawaban", tid + "_" + userId));
    return d.exists() ? (d.data().idx || []) : null;
  } catch (e) { return null; }
}

async function submitPosttest(p, t, jawaban, fotoId, wajahFoto) {
  const w = nowIso();
  const idx = await kunciJawaban(p, t, jawaban);
  const kd = await getDoc(doc(db, "posttest_kunci", t.id));
  const kunci = kd.exists() ? (kd.data().kunci || []) : [];
  let benar = 0;
  const detail = (t.soal || []).map((q, i) => {
    const ok = idx[i] >= 0 && idx[i] === kunci[i];
    if (ok) benar++;
    return { soalId: q.id, soal: q.teks, jawaban: (q.opsi || [])[idx[i]] != null ? q.opsi[idx[i]] : "", kunci: (q.opsi || [])[kunci[i]] || "", benar: ok };
  });
  const total = detail.length;
  const poin = benar * POIN_PER_BENAR;
  const s = snap(p);
  const ledgerId = "pt_" + t.id + "_" + p.id;

/* ---------- import petugas dari Excel ---------- */
async function muatSheetJS() {
  if (window.XLSX) return window.XLSX;
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = res;
    s.onerror = () => rej(new Error("Gagal memuat pembaca Excel. Periksa koneksi internet."));
    document.head.appendChild(s);
  });
  return window.XLSX;
}

async function bacaFileImport(file) {
  const X = await muatSheetJS();
  const wb = X.read(await file.arrayBuffer(), { type: "array" });
  const adaUserId = (n) => ((X.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false })[0]) || [])
    .map((h) => String(h).trim().toLowerCase()).includes("user_id");
  const sheet = wb.SheetNames.find(adaUserId) || wb.SheetNames[0];
  return { sheet, data: X.utils.sheet_to_json(wb.Sheets[sheet], { defval: "", raw: true }) };
}

const HURUF_KUNCI = { A: 0, B: 1, C: 2, D: 3, "1": 0, "2": 1, "3": 2, "4": 3 };

function siapkanSoal(data, tipe) {
  const isKu = tipe === "kuesioner";
  const maks = isKu ? MAKS_PERTANYAAN : MAKS_SOAL;
  const ambil = (r, keys) => {
    for (const k of Object.keys(r)) if (keys.includes(String(k).trim().toLowerCase())) return String(r[k] == null ? "" : r[k]).trim();
    return "";
  };
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const teks = ambil(r, ["pertanyaan", "soal", "teks", "question"]);
    const mentah = [1, 2, 3, 4].map((n) => ambil(r, ["opsi" + n, "opsi_" + n, "pilihan" + n, "jawaban" + n, ["a", "b", "c", "d"][n - 1]]));
    /* baris kosong di bawah data diabaikan, bukan dianggap salah */
    if (!teks && !mentah.some((o) => o)) return;
    const isi = mentah.map((o, n) => ({ o, n })).filter((x) => x.o);
    let alasan = "", kunci = 0;
    if (!teks) alasan = "pertanyaan kosong";
    else if (isi.length < 2) alasan = "minimal 2 opsi";
    else if (valid.length >= maks) alasan = "melebihi maksimal " + maks;
    else if (!isKu) {
      const kolom = HURUF_KUNCI[ambil(r, ["kunci", "kunci_jawaban", "jawaban_benar", "answer"]).toUpperCase()];
      if (kolom === undefined) alasan = "kunci harus diisi 1-4 atau A-D";
      else {
        kunci = isi.findIndex((x) => x.n === kolom);
        if (kunci < 0) alasan = "kunci menunjuk opsi yang kosong";
      }
    }
    if (alasan) { salah.push({ baris, teks, alasan }); return; }
    valid.push({ teks, opsi: isi.map((x) => x.o), kunci });
  });
  return { valid, salah };
}

/* ---- upload knowledge / hadiah / adjustment ---- */
function ambilKol(r, keys) {
  for (const k of Object.keys(r)) if (keys.includes(String(k).trim().toLowerCase())) return String(r[k] == null ? "" : r[k]).trim();
  return "";
}
const TIPE_KN = ["KV", "PDF", "VID", "DOC", "FAQ"];

function siapkanKnowledge(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const judul = ambilKol(r, ["judul", "nama", "materi", "title"]);
    const url = ambilKol(r, ["url", "link", "tautan"]);
    if (!judul && !url) return;
    const tipe = ambilKol(r, ["tipe", "jenis", "type"]).toUpperCase();
    const grp = ambilKol(r, ["group", "grup"]);
    let alasan = "";
    if (!judul) alasan = "judul kosong";
    else if (!url) alasan = "url kosong";
    else if (!/^https?:\/\//i.test(url)) alasan = "url harus diawali http:// atau https://";
    else if (valid.length >= MAKS_BARIS_UPLOAD.knowledge) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.knowledge;
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({
      judul, url, tipe: TIPE_KN.includes(tipe) ? tipe : "PDF",
      group: GROUPS.includes(grp) ? grp : "semua",
      area: ambilKol(r, ["area", "area_name"]), regional: ambilKol(r, ["regional", "regional_name"])
    });
  });
  return { valid, salah };
}

function siapkanHadiah(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const nama = ambilKol(r, ["nama", "hadiah", "nama_hadiah", "item"]);
    const poinRaw = ambilKol(r, ["poin", "point", "harga"]);
    if (!nama && !poinRaw) return;
    const poin = parseInt(poinRaw.replace(/[^\d-]/g, ""), 10);
    const stokRaw = ambilKol(r, ["stok", "stock", "kuota"]);
    let alasan = "";
    if (!nama) alasan = "nama hadiah kosong";
    else if (!(poin > 0)) alasan = "poin harus angka lebih dari 0";
    else if (valid.length >= MAKS_BARIS_UPLOAD.hadiah) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.hadiah;
    if (alasan) { salah.push({ baris, alasan }); return; }
    /* stok kosong atau tanda hubung = tak terbatas (-1) */
    const stok = !stokRaw || stokRaw === "-" ? -1 : Math.max(0, parseInt(stokRaw.replace(/[^\d]/g, ""), 10) || 0);
    valid.push({ nama, poin, stok });
  });
  return { valid, salah };
}

function siapkanAdjustment(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const id = ambilKol(r, ["user_id", "userid", "id", "id_digipos", "username_digipos", "username", "kode", "code"]);
    const poinRaw = ambilKol(r, ["poin", "point", "delta", "adjustment"]);
    const alasanKol = ambilKol(r, ["alasan", "keterangan", "catatan", "reason"]);
    if (!id && !poinRaw) return;
    const poin = parseInt(poinRaw.replace(/[^\d+-]/g, ""), 10);
    let alasan = "";
    if (!id) alasan = "ID / Username kosong";
    else if (!poin) alasan = "poin kosong atau nol";
    else if (!alasanKol) alasan = "alasan wajib diisi";
    else if (valid.length >= MAKS_BARIS_UPLOAD.adjustment) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.adjustment;
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({ baris, id, poin, alasan: alasanKol });
  });
  return { valid, salah };
}

/* Baris dobel (area+regional+branch+cluster sama persis) dengan Master Wilayah yang ada dilewati otomatis */
function siapkanWilayah(data) {
  const valid = [], salah = [];
  const kunci = new Set();
  data.forEach((r, i) => {
    const baris = i + 2;
    const area = ambilKol(r, ["area", "area_name", "nama_area"]);
    const regional = ambilKol(r, ["regional", "regional_name", "nama_regional"]);
    const branch = ambilKol(r, ["branch", "branch_name", "nama_branch"]);
    const cluster = ambilKol(r, ["cluster", "cluster_name", "nama_cluster"]);
    if (!area && !regional && !branch && !cluster) return;
    let alasan = "";
    if (!area || !regional || !branch || !cluster) alasan = "area/regional/branch/cluster harus lengkap semua";
    else if (valid.length >= MAKS_BARIS_UPLOAD.wilayah) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.wilayah;
    else {
      const k = [area, regional, branch, cluster].join("|");
      if (kunci.has(k)) alasan = "baris dobel dalam file";
      else kunci.add(k);
    }
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({ area, regional, branch, cluster });
  });
  return { valid, salah };
}

    return "";
  };
  const valid = [], salah = [], ids = new Set(), kodes = new Set();
  data.forEach((r, i) => {
    const userId = normUserId(pick(r, ["user_id", "id_digipos", "userid"]));
    const kode = normKode(pick(r, ["username_digipos", "username", "code", "kode"]));
    const cluster = pick(r, ["cluster_name", "cluster", "nama_cluster"]);
    const branch = pick(r, ["branch", "branch_name", "nama_branch"]);
    const regional = pick(r, ["regional", "regional_name", "nama_regional"]);

async function jalankanImport(valid, log) {
  log("Membaca akun yang sudah ada…");

  log(fmtNum(ada.size) + " akun sudah ada (dilewati), " + fmtNum(baru.length) + " akun baru akan dibuat.");
  const now = nowIso();
  for (let i = 0; i < baru.length; i += IMPORT_BATCH) {
    const b = writeBatch(db);
    baru.slice(i, i + IMPORT_BATCH).forEach((r) => {
      const d = {
        kode: r.kode, nama: r.nama || "", group: r.group, area: r.area, regional: r.regional, branch: r.branch, cluster: r.cluster,
        status: "belum_lengkap", sumber: "import", createdAt: now, poinPeringkat: 0, saldo: 0
      };
      d[GRP_FIELD[r.group]] = 0;
      b.set(doc(db, "petugas", r.userId), d);
    });
    await b.commit();
    log("Tersimpan " + fmtNum(Math.min(i + IMPORT_BATCH, baru.length)) + " / " + fmtNum(baru.length));
  }
  const k = (w) => [w.area, w.regional, w.branch, w.cluster].join("|");
  const peta = new Map();
  (C.wilayah || []).forEach((w) => peta.set(k(w), w));
  valid.forEach((r) => peta.set(k(r), { area: r.area, regional: r.regional, branch: r.branch, cluster: r.cluster }));
  const rowsW = Array.from(peta.values()).sort((a, b) => k(a).localeCompare(k(b)));
  await setDoc(doc(db, "master", "wilayah"), { rows: rowsW, updatedAt: nowIso() });
  C.wilayah = rowsW; C.wilayahLoaded = true;
  log("Master wilayah diperbarui: " + fmtNum(rowsW.length) + " cluster.");
  return { dibuat: baru.length, dilewati: valid.length - baru.length, wilayah: rowsW.length };
}

/* ---------- admin: data petugas ---------- */
async function cariUserId(input) {
  const raw = String(input || "").trim();
  if (USERID_RE.test(normUserId(raw))) return normUserId(raw);
  const kode = normKode(raw);
  if (!KODE_RE.test(kode)) return null;
  const qs = await getDocs(query(col("petugas"), where("kode", "==", kode), limit(1)));
  return qs.empty ? null : qs.docs[0].id;
}

async function loadPetugasPage(reset) {
  const f = S.fPetugas, P = C.adm.petugas;
  const key = [f.group, f.status, f.area, f.regional, f.branch, f.cluster, f.q].join("|");
  if (reset || P.key !== key) { P.rows = []; P.cursor = null; P.habis = false; P.key = key; }
  if (P.habis || P.loading) return;
  P.loading = true; render();
  try {
    if (f.q.trim()) {
      const id = await cariUserId(f.q);
      const d = id ? await getDoc(doc(db, "petugas", id)) : null;
      P.rows = d && d.exists() ? [Object.assign({ id: d.id }, d.data())] : [];
      P.habis = true;
    } else {
      /* Semua filter di bawah adalah equality (==) murni: Firestore memakai index otomatis
         gabungan tanpa perlu composite index manual, selama tidak ada orderBy di field lain. */
      const cons = [];
      if (f.group) cons.push(where("group", "==", f.group));
      if (f.status) cons.push(where("status", "==", f.status));
      if (f.area) cons.push(where("area", "==", f.area));
      if (f.regional) cons.push(where("regional", "==", f.regional));
      if (f.branch) cons.push(where("branch", "==", f.branch));
      if (f.cluster) cons.push(where("cluster", "==", f.cluster));
      if (P.cursor) cons.push(startAfter(P.cursor));
      cons.push(limit(HALAMAN));
      const qs = await getDocs(query(col("petugas"), ...cons));
      P.rows = P.rows.concat(rows(qs));
      P.cursor = qs.docs.length ? qs.docs[qs.docs.length - 1] : P.cursor;
      P.habis = qs.docs.length < HALAMAN;
    }
  } catch (e) { toast("no", "Gagal memuat data petugas: " + e.message); }
  P.loading = false; render();
}

async function tolakRedeem(r, alasan) {
  /* Dipindah ke ID baru supaya slot {userId}_{periode} kosong lagi: kuota 1x/bulan kembali */
  const b = writeBatch(db);
  const copy = Object.assign({}, r);
  delete copy.id;
  b.set(doc(db, "redeem", r.id + "_tolak_" + Date.now()), Object.assign(copy, {
    status: "ditolak", alasan: alasan || "", selesaiAt: nowIso(), oleh: S.adminUser ? S.adminUser.email : "admin"
  }));
  b.delete(doc(db, "redeem", r.id));
  const h = C.hadiah[r.hadiahId];
  if (h && h.stok !== -1) b.update(doc(db, "hadiah", r.hadiahId), { stok: increment(1) });
  await b.commit();
}

function kotakInfo(teks, warna) {

  return '<div class="card" style="' + c + 'font-size:13px;font-weight:600;">' + teks + "</div>";
}
function opsiWilayah(level, d) {
  const out = [];
  C.wilayah.forEach((r) => {
    if (level === "area") out.push(r.area);
    else if (level === "regional" && r.area === d.area) out.push(r.regional);
    else if (level === "branch" && r.area === d.area && r.regional === d.regional) out.push(r.branch);
    else if (level === "cluster" && r.area === d.area && r.regional === d.regional && r.branch === d.branch) out.push(r.cluster);
  });
  return out.filter((v, i, a) => v && a.indexOf(v) === i).sort();
}

/* Empat dropdown berjenjang: Area menyempit ke Regional, lalu Branch, lalu Cluster.
   Semua exact-match, dipetakan dari Master Wilayah yang sudah dimuat gratis di memori. */
function pilihWilayahFilter(prefix, f) {
  const uniq = (arr) => arr.filter((v, i, a) => a.indexOf(v) === i).sort();
  const cocok = (w, sd) => (!f.area || w.area === f.area) && (sd < 1 || !f.regional || w.regional === f.regional) && (sd < 2 || !f.branch || w.branch === f.branch);
  const areas = uniq(C.wilayah.map((w) => w.area));
  const regs = uniq(C.wilayah.filter((w) => cocok(w, 0)).map((w) => w.regional));
  const branches = uniq(C.wilayah.filter((w) => cocok(w, 1)).map((w) => w.branch));
  const clusters = uniq(C.wilayah.filter((w) => cocok(w, 2)).map((w) => w.cluster));
  const opt = (arr, val, semua) => '<option value="">' + semua + "</option>" + arr.map((x) => '<option value="' + esc(x) + '" ' + (val === x ? "selected" : "") + ">" + esc(x) + "</option>").join("");
  return '<select data-in="' + prefix + '.area">' + opt(areas, f.area, "Semua Area") + "</select>" +
    '<select data-in="' + prefix + '.regional">' + opt(regs, f.regional, "Semua Regional") + "</select>" +
    '<select data-in="' + prefix + '.branch">' + opt(branches, f.branch, "Semua Branch") + "</select>" +
    '<select data-in="' + prefix + '.cluster">' + opt(clusters, f.cluster, "Semua Cluster") + "</select>";
}

  return head("Data Petugas", (C.adm.stats ? fmtNum(C.adm.stats.total) + " akun &middot; " : "") + "dimuat per " + HALAMAN + " baris") +

      '<input type="text" class="mono" placeholder="Cari ID / Username (persis)" value="' + esc(f.q) + '" data-in="fPetugas.q" style="min-width:230px;">' +
      '<button class="btn btn-ghost btn-sm" data-do="cariPetugas">Cari</button>' +
      '<select data-in="fPetugas.group">' + opt(GROUPS, f.group, "Semua Group") + "</select>" +

    '<div class="tbl-wrap"><table><thead><tr><th>ID Digipos</th><th>Username</th><th>Nama</th><th>Group</th><th>Regional / Cluster</th><th>Poin</th><th>Saldo</th><th>Status</th><th></th></tr></thead><tbody>' +
    (!P.rows.length ? '<tr><td colspan="9"><div class="empty">' + (P.loading ? "Memuat&hellip;" : "Tidak ada petugas yang cocok.") + "</div></td></tr>" :
      P.rows.map((p) => '<tr><td class="mono">' + esc(p.id) + '</td><td class="mono">' + esc(p.kode || "-") + '</td><td style="font-weight:600;">' + esc(p.nama || "—") + "</td><td>" + grpTag(p.group) + "</td>" +
        '<td style="font-size:12px;color:var(--ink-dim);">' + esc(p.regional || "-") + " / " + esc(p.cluster || "-") + "</td>" +
        '<td class="mono">' + fmtNum(p.poinPeringkat) + '</td><td class="mono">' + fmtNum(p.saldo) + "</td><td>" + pillStatus(p.status) + "</td>" +
        '<td><button class="btn btn-ghost btn-sm" data-do="detailPetugas" data-v="' + esc(p.id) + '">Detail</button></td></tr>').join("")) +
    "</tbody></table></div>" +
    '<div class="pager"><span>' + fmtNum(P.rows.length) + " baris dimuat</span>" +
    (!P.habis ? '<button class="btn btn-ghost btn-sm" data-do="petugasLagi" ' + (P.loading ? "disabled" : "") + ">" + (P.loading ? "Memuat…" : "Muat " + HALAMAN + " lagi") + "</button>" : "<span>Semua sudah dimuat</span>") + "</div>";
}

/* ---------- target & jadwal ---------- */
function pilihTarget(prefix, t) {
  const areas = C.wilayah.map((w) => w.area).filter((v, i, a) => a.indexOf(v) === i).sort();
  const regs = C.wilayah.filter((w) => !t.area || w.area === t.area).map((w) => w.regional).filter((v, i, a) => a.indexOf(v) === i).sort();
  return '<select data-in="' + prefix + '.group"><option value="semua">Semua Group</option>' + GROUPS.map((g) => "<option " + (t.group === g ? "selected" : "") + ">" + esc(g) + "</option>").join("") + "</select>" +
    '<select data-in="' + prefix + '.area"><option value="">Semua Area</option>' + areas.map((a) => '<option value="' + esc(a) + '" ' + (t.area === a ? "selected" : "") + ">" + esc(a) + "</option>").join("") + "</select>" +
    '<select data-in="' + prefix + '.regional"><option value="">Semua Regional</option>' + regs.map((r) => '<option value="' + esc(r) + '" ' + (t.regional === r ? "selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>";
}
function ringkasTarget(x) {
  const t = x.target || {};
  const bag = [(!t.group || t.group === "semua") ? "semua group" : t.group];
  if (t.area) bag.push(t.area);
  if (t.regional) bag.push(t.regional);
  return bag.map(esc).join(" &middot; ");
}
function ringkasJadwal(x) {
  if (!x.mulai && !x.selesai) return "tanpa batas waktu";
  return (x.mulai ? esc(x.mulai) : "sekarang") + " s/d " + (x.selesai ? esc(x.selesai) : "seterusnya");
}

function kartuModul(m, tipe) {
  const isKu = tipe === "kuesioner";
  const items = isKu ? (m.pertanyaan || []) : (m.soal || []);
  const buka = S.openQ === tipe + ":" + m.id;
  const d = S.draftSoal;
  const terkunci = !isKu && (C.adm.peserta[m.id] || 0) > 0;
  let html = '<div class="card" style="margin-bottom:14px;"><div class="row" style="flex-wrap:wrap;">' +
    '<div class="grow"><div style="font-weight:800;font-size:16px;">' + esc(m.judul) + "</div>" +
    '<div class="lbl" style="color:var(--ink-dim);">' + items.length + " " + (isKu ? "pertanyaan" : "soal") + " &middot; " + ringkasTarget(m) + " &middot; " + ringkasJadwal(m) + "</div></div>" +
    '<span class="pill ' + (m.aktif ? "pill-good" : "pill-neutral") + '" style="cursor:pointer;" data-do="toggleAktif" data-t="' + tipe + '" data-v="' + m.id + '">' + (m.aktif ? "Aktif" : "Nonaktif") + "</span>" +
    '<button class="btn btn-ghost btn-sm" data-do="bukaSoal" data-t="' + tipe + '" data-v="' + m.id + '">' + (buka ? "Tutup" : "Kelola " + (isKu ? "Pertanyaan" : "Soal")) + "</button>" +
    '<button class="btn btn-danger btn-sm" data-do="hapusModul" data-t="' + tipe + '" data-v="' + m.id + '">Hapus</button></div>';

        '<ul style="margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-dim);">' +

      (terkunci ? '<div class="note">Sudah ada ' + fmtNum(C.adm.peserta[m.id]) + " peserta &mdash; soal dikunci supaya penilaian tetap konsisten. Buat post test baru untuk materi baru.</div>" :

        '<div class="card" style="background:var(--surface-2);"><div class="card-title">Tambah satu ' + (isKu ? "Pertanyaan" : "Soal (maks " + MAKS_SOAL + ")") + "</div>" +

          (isKu ? "" : '<input type="radio" name="kunci" ' + (d.kunci === i ? "checked" : "") + ' data-do="setKunci" data-v="' + i + '" style="width:auto;flex:none;">') +
          '<input type="text" class="grow" value="' + esc(d.opsi[i]) + '" data-in="draftSoal.opsi.' + i + '"></div></div>').join("") +
        '<button class="btn btn-primary btn-sm" style="margin-top:12px;" data-do="tambahSoal" data-t="' + tipe + '" data-v="' + m.id + '">Tambah</button>' +
        (isKu ? "" : '<div class="note" style="margin-top:10px;">Pilih radio di sebelah opsi untuk menandai kunci. Kunci disimpan terpisah dan tidak bisa dibaca petugas sebelum menjawab.</div>') + "</div>") +
      "</div>";
  }
  return html + "</div>";
}

function vShell(inner) {

function render() {
  const root = document.getElementById("app");
  let html;
  if (S.mode === "admin") {
    html = !S.adminUser ? vAdmLogin() : !S.adminCek ? layarMuat("Memeriksa akses admin&hellip;") : S.adminOk ? vAdmin() : vAdmBelum();
  } else if (S.view === "boot") html = layarMuat("Membuka DEBY&hellip;");
  else if (S.view === "daftar") html = vDaftar();
  else if (S.view === "admLogin") html = vAdmLogin();
  else if (!S.me || S.view === "masuk") html = vMasuk();
  else if (!S.profilSaya) html = layarMuat("Memuat akun&hellip;");
  else if (S.profilSaya.status === "belum_lengkap") html = vLengkapi();
  else if (S.view === "gate" && S.gate) html = vShell(vGate());
  else if (S.view === "run" && S.run) html = vShell(vRun());
  else if (S.view === "hasil" && S.hasil) html = vShell(vHasil());
  else {
    const fn = { home: vHome, tugas: vTugas, leaderboard: vLeaderboard, knowledge: vKnowledge, hadiah: vHadiah, poin: vPoin, profil: vProfil, bantuan: vBantuan }[S.tab] || vHome;
    html = vShell(fn());
  }
  if (S.toast) html += '<div class="toast ' + (S.toast.kind === "ok" ? "ok" : S.toast.kind === "no" ? "no" : "") + '">' + esc(S.toast.msg) + "</div>";
  if (S.modal) html += S.modal;

  /* pertahankan fokus & posisi kursor saat render ulang */
  const a = document.activeElement;
  const keep = a && a.getAttribute && a.getAttribute("data-in");
  const selStart = keep && typeof a.selectionStart === "number" ? a.selectionStart : null;
  root.innerHTML = html;
  if (keep) {
    const el = root.querySelector('[data-in="' + keep + '"]');
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }
}

/* ============ navigasi ============ */
function onTab(v) {
  if (v === "home") { loadKatalog(); loadLeaderboard(); loadRank(); }
  if (v === "tugas" || v === "knowledge") loadKatalog();
  if (v === "leaderboard") { loadLeaderboard(); loadRank(); }
  if (v === "hadiah") loadHadiah();
}
function onAdmMenu(v) {
  if (v === "dashboard" && !C.adm.stats) loadAdminStats();
  if (v === "petugas" && !C.adm.petugas.rows.length) loadPetugasPage(true);
  if ((v === "kuesioner" || v === "posttest" || v === "knowledge" || v === "pengaturan") && !C.wilayahLoaded) loadWilayah();
  if (v === "posttest") loadKunciAdmin();
  if (v === "poin") { loadLeaderboard(); loadLedgerTerbaru(); }
  if (v === "redeem") subscribeAdminRedeem();
}
function mulaiSesi(userId) {
  S.me = userId; S.view = "app"; S.tab = "home"; S.profilSaya = null;
  render();
  loadSaya(userId).then((ok) => {
    if (!ok || !S.profilSaya) return;
    if (S.profilSaya.status === "belum_lengkap") { S.lengkapi.nama = S.profilSaya.nama || ""; render(); }
    else onTab("home");
  });
}
function pesanGagal(e, fallback) {
  if (e && e.code === "permission-denied") return "Aksi ditolak server. Pastikan kamu membuka DEBY dari HP yang terhubung ke akunmu, lalu coba lagi.";
  return (fallback || "Gagal") + ": " + (e && e.message ? e.message : e);
}
function setPath(path, val) {
  const parts = path.split(".");
  let o = S;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  const last = parts[parts.length - 1];
  if (Array.isArray(o)) o[parseInt(last, 10)] = val; else o[last] = val;
}
const modulField = (t) => (t === "kuesioner" ? "pertanyaan" : "soal");

const PESAN_MASUK = {
  "format-id": "ID Digipos harus tepat 10 digit angka.",
  "username-kosong": "Username Digipos wajib diisi.",
  "tidak-terdaftar": "ID Digipos belum terdaftar. Kalau kamu petugas baru, pilih <b>Daftar sebagai petugas baru</b> di bawah.",
  "username-salah": "Username Digipos tidak cocok dengan ID tersebut.",
  "nonaktif": "Akun dinonaktifkan. Hubungi Admin.",
  "hp-akun-lain": "HP/browser ini sudah terhubung ke akun lain. Satu HP hanya untuk satu akun.",
  "terikat-hp-lain": "Akun ini sudah terhubung ke HP atau browser lain. Kalau biasanya membuka dari Chrome, pastikan sekarang juga dari Chrome. Kalau memang ganti HP, minta Admin menekan <b>Reset HP</b>.",
  "sudah-terdaftar": "ID ini sudah terdaftar. Kembali ke layar Masuk dan pakai ID &amp; Username Digipos.",
  "username-dipakai": "Username Digipos ini sudah dipakai akun lain. Periksa kembali, atau hubungi Admin."
};
function pesanMasuk(e) {
  if (e && PESAN_MASUK[e.kode]) return PESAN_MASUK[e.kode];
  if (e && String(e.code || "").indexOf("auth/") === 0) return "Login perangkat belum aktif di sistem. Hubungi Admin.";
  if (e && e.code === "permission-denied") return "Data ditolak server. Periksa kembali isianmu.";
  return "Gagal: " + esc(e && e.message ? e.message : e);
}

/* ============ aksi ============ */
const DO = {
  ke(v) { S.view = v; S.masuk.err = ""; S.daftar.err = ""; S.admLogin.err = ""; render(); },
  keDaftar() { S.view = "daftar"; S.daftar.err = ""; if (!C.wilayahLoaded) loadWilayah(); render(); },
  tab(v) { S.view = "app"; S.tab = v; S.gate = null; S.run = null; render(); onTab(v); },
  setGroup(v) { S.daftar.group = v; render(); },
  lbFilter(v) { S.lbFilter = v; render(); },
  muatUlang() { if (!S.me) return; loadSaya(S.me); loadKatalog(true); loadLeaderboard(true); loadRank(true); toast("ok", "Data dimuat ulang."); },
  muatHadiah() { loadHadiah(true); },
  bukaKamera(v) { bukaKamera(v); },

  async masuk() {
    const m = S.masuk;
    if (m.busy) return;
    m.err = ""; m.info = ""; m.busy = true; render();
    try {
      const userId = await masukPetugas(m.id, m.username);
      S.masuk = { id: "", username: "", err: "", info: "", busy: false };
      mulaiSesi(userId);
    } catch (e) {
      m.busy = false;
      m.err = pesanMasuk(e);
      if (e.kode === "tidak-terdaftar") { S.daftar.userId = normUserId(m.id); S.daftar.kode = normKode(m.username); }
      render();
    }
  },

  async daftar() {
    const d = S.daftar;
    const err = (t) => { d.err = t; render(); };
    if (d.busy) return;
    if (d.nama.trim().length < 2) return err("Nama lengkap wajib diisi.");
    if (!d.group) return err("Pilih group.");
    if (!USERID_RE.test(normUserId(d.userId))) return err("ID Digipos harus tepat 10 digit angka.");
    if (!KODE_RE.test(normKode(d.kode))) return err("Format Username Digipos tidak sesuai.");
    if (!d.nomor.trim()) return err("Nomor aktif wajib diisi.");
    if (!d.area || !d.regional || !d.branch || !d.cluster) return err("Lengkapi 4 data wilayah.");
    if (!d.foto) return err("Foto petugas wajib diambil.");
    d.busy = true; d.err = ""; render();
    try {
      const userId = await daftarBaru(d);
      S.daftar = { nama: "", group: "", userId: "", kode: "", nomor: "", area: "", regional: "", branch: "", cluster: "", foto: null, err: "", busy: false };
      mulaiSesi(userId);
      toast("ok", "Terdaftar. Akunmu menunggu verifikasi Admin.");
    } catch (e) { d.busy = false; err(pesanMasuk(e)); }
  },

  async lengkapi() {
    const l = S.lengkapi;
    const err = (t) => { l.err = t; render(); };
    if (l.busy) return;
    if (l.nama.trim().length < 2) return err("Nama lengkap wajib diisi.");
    if (!l.nomor.trim()) return err("Nomor aktif wajib diisi.");
    if (!l.foto) return err("Foto petugas wajib diambil.");
    l.busy = true; l.err = ""; render();
    try {
      await lengkapiProfil(S.profilSaya, l);
      S.lengkapi = { nama: "", nomor: "", foto: null, err: "", busy: false };
      await loadSaya(S.me);
      onTab("home");
      toast("ok", "Profil lengkap. Selamat datang di DEBY!");
    } catch (e) { l.busy = false; err(pesanGagal(e, "Gagal menyimpan")); }
  },

  keluar() { keluarPetugas(); },

  async mulai(v, el) {
    const t = el.getAttribute("data-t");
    if (!bolehBeraktivitas()) return toast("no", "Akun belum diverifikasi Admin.");
    if (t === "kuesioner" && sudahKuesioner(v)) return toast("no", "Kuesioner ini sudah kamu isi.");
    if (t === "posttest" && hasilPosttest(v)) return toast("no", "Post test ini sudah kamu kerjakan.");
    const modul = C.katalog[t].find((x) => x.id === v);
    if (!modul) return toast("no", "Modul tidak ditemukan. Tekan Muat ulang.");
    if (t === "posttest" && (await jawabanTerkunci(v, S.me))) {
      /* jawaban sudah terkunci tapi nilai belum tersimpan — lanjutkan penilaian, tidak mengulang */
      try {
        const h = await submitPosttest(S.profilSaya, modul, null, null);
        S.hasil = Object.assign({ tipe: "posttest" }, h); S.view = "hasil"; render();
        loadSaya(S.me); loadRank(true);
      } catch (e) { toast("no", pesanGagal(e, "Gagal melanjutkan penilaian")); }
      return;
    }
    S.gate = { tujuan: t, refId: v, foto: null, busy: false }; S.view = "gate"; render();
  },
  mulaiRedeem(v) {
    if (!bolehBeraktivitas()) return toast("no", "Akun belum diverifikasi Admin.");
    S.gate = { tujuan: "redeem", refId: v, foto: null, busy: false }; S.view = "gate"; render();
  },
  gateBatal() { S.gate = null; S.view = "app"; render(); },

  async gateLanjut() {
    const g = S.gate, p = S.profilSaya;
    if (!g || !g.foto || g.busy) return;
    g.busy = true; render();
    try {
      if (g.tujuan === "redeem") {
        const h = C.hadiah[g.refId];
        if (!h) throw new Error("Hadiah tidak ditemukan.");
        if (redeemBulanIniSaya().length) throw new Error("Kuota penukaran bulan ini sudah dipakai.");
        if (tersediaSaya() < h.poin) throw new Error("Poin tidak cukup.");
        if (h.stok !== -1 && h.stok <= 0) throw new Error("Stok habis.");
        const fotoId = await simpanFotoAktivitas(p, "redeem", g.foto, g.wajah);
        await ajukanRedeem(p, g.refId, h, fotoId, g.wajah ? g.wajah.status : "tidak_dicek");
        S.gate = null; S.view = "app"; S.tab = "hadiah";
        loadSaya(S.me); loadHadiah(true);
        return toast("ok", "Permintaan terkirim. Poin ditahan sampai Admin menyetujui.");
      }
      const modul = C.katalog[g.tujuan].find((x) => x.id === g.refId);
      if (!modul) throw new Error("Modul tidak ditemukan.");
      const fotoId = await simpanFotoAktivitas(p, g.tujuan, g.foto, g.wajah);
      S.run = { tipe: g.tujuan, doc: modul, idx: 0, jawaban: {}, fotoId, wajah: g.wajah ? g.wajah.status : "tidak_dicek", busy: false };
      S.gate = null; S.view = "run"; render();
    } catch (e) { if (S.gate) S.gate.busy = false; toast("no", pesanGagal(e, "Gagal")); }
  },

  runBack() { const r = S.run; if (!r) return; if (r.idx === 0) { S.run = null; S.view = "app"; return render(); } r.idx--; render(); },
  async runNext() {
    const r = S.run;
    if (!r || r.busy) return;
    const items = r.tipe === "kuesioner" ? r.doc.pertanyaan : r.doc.soal;
    if (r.idx < items.length - 1) { r.idx++; return render(); }
    r.busy = true; render();
    try {
      if (r.tipe === "kuesioner") { await submitKuesioner(S.profilSaya, r.doc, r.jawaban, r.fotoId, r.wajah); S.hasil = { tipe: "kuesioner" }; }
      else { const h = await submitPosttest(S.profilSaya, r.doc, r.jawaban, r.fotoId, r.wajah); S.hasil = Object.assign({ tipe: "posttest" }, h); }
      S.run = null; S.view = "hasil"; render();
      loadSaya(S.me); loadRank(true);
    } catch (e) { r.busy = false; toast("no", pesanGagal(e, "Gagal mengirim")); }
  },

  async simpanProfil() {
    const nomor = S.profil.nomor.trim();
    if (!nomor) return toast("no", "Isi nomor aktif yang baru.");
    try { await setDoc(doc(db, "petugas_cek", S.me), { nomor }, { merge: true }); S.profil.nomor = ""; toast("ok", "Nomor aktif diperbarui."); }
    catch (e) { toast("no", pesanGagal(e, "Gagal menyimpan")); }
  },
  async ajukanFoto() {
    if (!S.profil.foto) return;
    try {
      const b = writeBatch(db);
      b.set(doc(db, "petugas_cek", S.me), { fotoPending: S.profil.foto }, { merge: true });
      if (wajahBermasalah(S.profil.wajah)) b.set(doc(collection(db, "peringatan")), dokPeringatan(S.profilSaya, "ganti_foto", S.profil.wajah, ""));
      await b.commit();
      S.profil.foto = null; S.profil.wajah = null;
      toast("ok", "Perubahan foto menunggu persetujuan Admin.");
    } catch (e) { toast("no", pesanGagal(e, "Gagal")); }
  },

  /* ---- admin ---- */
  async admMasuk() {
    const a = S.admLogin;
    if (!a.email || !a.pass) { a.err = "Isi email dan kata sandi."; return render(); }
    try { await signInWithEmailAndPassword(auth, a.email, a.pass); S.admLogin = { email: "", pass: "", err: "" }; }

let faceapiMod = null, faceapiJanji = null;
function siapkanDeteksiWajah() {
  if (faceapiJanji) return faceapiJanji;
  faceapiJanji = (async () => {
    const f = await import(FACEAPI_BASE + "/dist/face-api.esm.js");
    try { await f.tf.setBackend("webgl"); } catch (e) {}
    await f.tf.ready();
    await f.nets.tinyFaceDetector.loadFromUri(FACEAPI_BASE + "/model/");
    /* pemanasan: inferensi pertama lambat karena kompilasi shader, jangan dibebankan ke saat jepret */
    const c = document.createElement("canvas"); c.width = 160; c.height = 120;
    await f.detectAllFaces(c, new f.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: DETEKSI.skorMin }));
    faceapiMod = f;
    return f;
  })().catch((e) => { faceapiJanji = null; throw e; });
  return faceapiJanji;
}

    '<div class="cam-msg">Menyalakan kamera depan&hellip;</div>' +
    '<div class="cam-actions"><button class="btn btn-primary btn-block" data-k="jepret" disabled>Ambil Foto</button>' +
    '<button class="btn btn-block cam-sec" data-k="ulang" hidden>Ulangi</button>' +

    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { exact: "user" }, width: { ideal: 720 }, height: { ideal: 960 } } });
  } catch (e) {
    const n = e && e.name;
    return kPesan(n === "NotAllowedError" ? "Izin kamera ditolak. Di Chrome, ketuk ikon di samping alamat situs &rarr; izinkan <b>Kamera</b>, lalu coba lagi."
      : n === "OverconstrainedError" || n === "NotFoundError" ? "Kamera depan tidak ditemukan. Foto harus diambil dari HP."
      : "Kamera tidak bisa dibuka. Buka DEBY dari <b>Chrome</b> di HP.", "bad");
  }
  if (!K.el) { stream.getTracks().forEach((t) => t.stop()); return; }
  K.stream = stream;
  const track = stream.getVideoTracks()[0];
  const setelan = track && track.getSettings ? track.getSettings() : {};
  if (setelan.facingMode && setelan.facingMode !== "user") { tutupKamera(); return toast("no", "Hanya kamera depan yang boleh dipakai."); }
  const v = K.el.querySelector("video");
  v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  kPesan("Menyiapkan pendeteksi wajah&hellip; (unduhan &plusmn;1,5 MB, hanya sekali)");
  const ok = await deteksi;
  if (!K.el) return;
  kPesan(ok ? PESAN_POSISI : "Pendeteksi wajah gagal dimuat. Foto tetap bisa diambil dan akan ditandai untuk dicek Admin.", ok ? "" : "warn");
  kTombol("jepret", true, true);
}

function tutupKamera() {
  if (K.stream) { K.stream.getTracks().forEach((t) => t.stop()); K.stream = null; }
  if (K.el) { K.el.remove(); K.el = null; }
}

function jepretFrame() {
  const v = K.el.querySelector("video");
  const ukuran = K.tujuan === "gate" ? FOTO_AKTIVITAS : FOTO_BASELINE;
  const s = Math.min(1, ukuran.dim / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return { canvas: c, url: c.toDataURL("image/jpeg", ukuran.q) };
}

async function periksaWajah(canvas) {
  if (!faceapiMod) return { status: "tidak_dicek", skor: null };
  const det = await faceapiMod.detectAllFaces(canvas, new faceapiMod.TinyFaceDetectorOptions({ inputSize: DETEKSI.inputSize, scoreThreshold: DETEKSI.skorMin }));
  if (!det.length) return { status: "gagal", alasan: "Wajah tidak terdeteksi. Pastikan wajahmu terlihat jelas, tidak tertutup, dan cahaya cukup." };
  if (det.length > 1) return { status: "gagal", alasan: "Terdeteksi lebih dari satu wajah. Foto harus berisi wajahmu saja." };
  if (det[0].box.width / canvas.width < DETEKSI.rasioMin) return { status: "gagal", alasan: "Wajah terlalu jauh. Dekatkan HP ke wajahmu." };
  return { status: "ok", skor: +det[0].score.toFixed(2) };
}

async function kameraKlik(e) {
  const b = e.target.closest("[data-k]");
  if (!b || !K.el) return;
  const aksi = b.getAttribute("data-k");
  if (aksi === "batal") return tutupKamera();
  const v = K.el.querySelector("video"), still = K.el.querySelector(".cam-still");
  if (aksi === "ulang") {
    still.hidden = true; v.hidden = false; K.hasil = null;
    kTombol("ulang", false); kTombol("paksa", false); kTombol("jepret", true, true);
    return kPesan(PESAN_POSISI);
  }
  if (aksi === "paksa") {
    if (K.hasil) terimaFoto(K.hasil, { status: "tidak_terdeteksi", gagal: K.gagal, skor: null });
    return;
  }
  if (aksi !== "jepret" || !v.videoWidth) return;
  kTombol("jepret", true, false);
  const shot = jepretFrame();
  still.src = shot.url; still.hidden = false; v.hidden = true;
  kPesan("Memeriksa wajah&hellip;");
  let cek;
  try { cek = await periksaWajah(shot.canvas); } catch (err) { cek = { status: "tidak_dicek", skor: null }; }
  if (!K.el) return;
  if (cek.status === "ok" || cek.status === "tidak_dicek") {
    return terimaFoto(shot.url, { status: cek.status, gagal: K.gagal, skor: cek.skor != null ? cek.skor : null });
  }
  K.gagal++;
  K.hasil = shot.url;
  const habis = K.gagal >= DETEKSI.maksGagal;
  kPesan(cek.alasan + (habis ? "<br><b>Sudah " + K.gagal + "x gagal.</b> Kamu boleh mengirim foto ini dengan tanda peringatan untuk dicek Admin." : " (percobaan " + K.gagal + " dari " + DETEKSI.maksGagal + ")"), "bad");
  kTombol("jepret", false);
  kTombol("ulang", true, true);
  kTombol("paksa", habis, true);
}

function terimaFoto(url, meta) {
  const t = K.tujuan;
  tutupKamera();
  if (t === "daftar") { S.daftar.foto = url; S.daftar.wajah = meta; }
  else if (t === "lengkapi") { S.lengkapi.foto = url; S.lengkapi.wajah = meta; }
  else if (t === "gate" && S.gate) { S.gate.foto = url; S.gate.wajah = meta; }
  else if (t === "profil") { S.profil.foto = url; S.profil.wajah = meta; }
  render();
  if (meta.status !== "ok") toast("", "Foto akan dikirim dengan tanda peringatan untuk Admin.");
}

/* ============ event ============ */
const root = document.getElementById("app");
root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-do]");
  if (!el) return;
  if (el.classList.contains("modal-bd") && e.target.closest("[data-stop]")) return;
  const fn = DO[el.getAttribute("data-do")];
  if (fn) fn(el.getAttribute("data-v"), el);
});
root.addEventListener("input", (e) => {
  const el = e.target, path = el.getAttribute("data-in");
  if (!path || el.tagName === "SELECT") return;
  setPath(path, el.value);
  if (!el.getAttribute("data-live")) return;
  const hint = root.querySelector('[data-hint="' + path.split(".")[1] + '"]');
  if (!hint) return;
  if (path === "daftar.userId") {
    const bad = el.value && !USERID_RE.test(normUserId(el.value));
    hint.textContent = bad ? "Harus tepat 10 digit angka." : "10 digit angka, sesuai data Digipos.";
    hint.style.color = bad ? "var(--bad)" : "";
  }
  if (path === "daftar.kode") {
    const bad = el.value && !KODE_RE.test(normKode(el.value));
    hint.textContent = bad ? "Hanya huruf, angka, titik, dan garis bawah." : "Persis seperti di Digipos.";
    hint.style.color = bad ? "var(--bad)" : "";
  }
});
root.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const path = e.target.getAttribute && e.target.getAttribute("data-in");
  if (path === "masuk.id" || path === "masuk.username") DO.masuk();
  if (path === "admLogin.pass") DO.admMasuk();
  if (path === "fPetugas.q") DO.cariPetugas();
});
root.addEventListener("change", async (e) => {
  const el = e.target;

  const stId = el.getAttribute("data-status");
  if (stId) {
    try { await updateDoc(doc(db, "petugas", stId), { status: el.value }); toast("ok", "Status diperbarui."); }
    catch (err) { toast("no", pesanGagal(err, "Gagal")); }
    return;
  }

  const umumJenis = el.getAttribute("data-umum");
  if (umumJenis && el.files && el.files[0]) {
    const file = el.files[0];
    S.impUmum = Object.assign(kosongUmum(), { jenis: umumJenis, namaFile: file.name });
    render();
    try {
      const { data } = await bacaFileSoal(file);
      const r = umumJenis === "knowledge" ? siapkanKnowledge(data) : umumJenis === "hadiah" ? siapkanHadiah(data) : umumJenis === "wilayah" ? siapkanWilayah(data) : siapkanAdjustment(data);
      S.impUmum.valid = r.valid; S.impUmum.salah = r.salah;
      if (!r.valid.length && !r.salah.length) toast("no", "Tidak ada baris terbaca. Periksa nama kolom di baris pertama.");
    } catch (err) {
      S.impUmum = kosongUmum();
      toast("no", pesanGagal(err, "Gagal membaca file"));
    }
    el.value = "";
    render();
    return;
  }

  const soalKey = el.getAttribute("data-soal");
  if (soalKey && el.files && el.files[0]) {
    const file = el.files[0], tipe = soalKey.split(":")[0];
    S.impSoal = { key: soalKey, namaFile: file.name, valid: [], salah: [], busy: false };
    render();
    try {
      const { data } = await bacaFileSoal(file);
      const r = siapkanSoal(data, tipe);
      S.impSoal.valid = r.valid; S.impSoal.salah = r.salah;
      if (!r.valid.length && !r.salah.length) toast("no", "Tidak ada baris terbaca. Pastikan ada kolom pertanyaan dan opsi1-opsi4.");
    } catch (err) {
      S.impSoal = { key: "", namaFile: "", valid: [], salah: [], busy: false };
      toast("no", pesanGagal(err, "Gagal membaca file"));
    }
    el.value = "";
    render();
    return;
  }

  if (el.getAttribute("data-import") && el.files && el.files[0]) {
    const file = el.files[0];
    S.imp = Object.assign(S.imp, { namaFile: file.name, sheet: "", valid: [], salah: [], log: ["Membaca file…"], hasil: null });
    render();
    try {
      const { sheet, data } = await bacaFileImport(file);
      const { valid, salah } = siapkanImport(data, S.imp.group);
      S.imp = Object.assign(S.imp, { sheet, raw: data, valid, salah, log: [] });
    } catch (err) { S.imp.log = ["Gagal membaca file: " + (err.message || err)]; }
    el.value = "";
    return render();
  }

  const path = el.getAttribute("data-in");
  if (path && el.tagName === "SELECT") {
    setPath(path, el.value);
    if (path === "daftar.area") { S.daftar.regional = ""; S.daftar.branch = ""; S.daftar.cluster = ""; }
    if (path === "daftar.regional") { S.daftar.branch = ""; S.daftar.cluster = ""; }
    if (path === "daftar.branch") S.daftar.cluster = "";
    if (/^draftModul\.\w+\.area$/.test(path)) setPath(path.replace(/area$/, "regional"), "");
    if (path === "draftKn.area") S.draftKn.regional = "";
    if (path === "fPetugas.area") { S.fPetugas.regional = ""; S.fPetugas.branch = ""; S.fPetugas.cluster = ""; }
    if (path === "fPetugas.regional") { S.fPetugas.branch = ""; S.fPetugas.cluster = ""; }
    if (path === "fPetugas.branch") S.fPetugas.cluster = "";
    if (/^fPetugas\.(group|status|area|regional|branch|cluster)$/.test(path)) { S.fPetugas.q = ""; loadPetugasPage(true); }
    if (path === "imp.group" && S.imp.raw) { const r = siapkanImport(S.imp.raw, S.imp.group); S.imp.valid = r.valid; S.imp.salah = r.salah; }
    return render();
  }

  const ans = el.getAttribute("data-ans");
  if (ans && S.run) { S.run.jawaban[ans] = parseInt(el.value, 10); render(); }
});

/* ============ boot ============ */
async function cekAdmin(user) {
  S.adminCek = false; render();
  try { S.adminOk = (await getDoc(doc(db, "admins", user.uid))).exists(); }
  catch (e) { S.adminOk = false; }
  S.adminCek = true;
  render();
  if (S.adminOk) { subscribeAdminKatalog(); loadWilayah(); onAdmMenu(S.adminMenu); }
}

onAuthStateChanged(auth, (u) => {
  /* identitas anonim milik perangkat petugas tidak pernah dianggap calon admin */
  const user = u && !u.isAnonymous ? u : null;
  if (user) { S.adminUser = user; S.mode = "admin"; cekAdmin(user); return; }
  if (S.mode === "admin") {
    stop("admin"); stop("redeem");
    S.adminUser = null; S.adminOk = false; S.adminCek = false;
    S.mode = "petugas"; S.view = S.me ? "app" : "masuk";
    render();
  }
});

(async function mulai() {
  render();
  const userId = await sesiPerangkat();
  if (S.mode === "admin") return;
  if (userId) mulaiSesi(userId);
  else { S.view = "masuk"; render(); }
})();
</script>
